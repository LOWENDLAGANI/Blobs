# Local development and self-hosting.
#
#   docker compose up -d db     # just Postgres for `npm run dev`
#   docker compose up --build   # the whole app on http://localhost:3000
#
# The app talks to Postgres only through DATABASE_URL, so the same build runs
# against this container or a Supabase project.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blobs
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d blobs']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/blobs
      BLOBS_SECRET: local-development-secret-change-me
      DATA_DIR: /data
      PORT: 3000
      PG_SSL: disable
      # Optional: store workspace files in Supabase instead of the volume.
      # SUPABASE_URL: https://<ref>.supabase.co
      # SUPABASE_SERVICE_ROLE_KEY: <service_role key>
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
